name: digitalfix-kafka-ev3
services:
  zookeeper-1:
    image: confluentinc/cp-zookeeper:7.9.10
    hostname: zookeeper-1
    restart: unless-stopped
    environment:
      ZOOKEEPER_SERVER_ID: '1'
      ZOOKEEPER_CLIENT_PORT: '2181'
      ZOOKEEPER_TICK_TIME: '2000'
      ZOOKEEPER_INIT_LIMIT: '10'
      ZOOKEEPER_SYNC_LIMIT: '5'
      ZOOKEEPER_SERVERS: zookeeper-1:2888:3888;zookeeper-2:2888:3888;zookeeper-3:2888:3888
      KAFKA_HEAP_OPTS: -Xms64m -Xmx128m
    volumes:
    - zookeeper-1-data:/var/lib/zookeeper/data
    - zookeeper-1-log:/var/lib/zookeeper/log
    networks:
    - kafka-lab
    mem_limit: 320m
    stop_grace_period: 30s
  zookeeper-2:
    image: confluentinc/cp-zookeeper:7.9.10
    hostname: zookeeper-2
    restart: unless-stopped
    environment:
      ZOOKEEPER_SERVER_ID: '2'
      ZOOKEEPER_CLIENT_PORT: '2181'
      ZOOKEEPER_TICK_TIME: '2000'
      ZOOKEEPER_INIT_LIMIT: '10'
      ZOOKEEPER_SYNC_LIMIT: '5'
      ZOOKEEPER_SERVERS: zookeeper-1:2888:3888;zookeeper-2:2888:3888;zookeeper-3:2888:3888
      KAFKA_HEAP_OPTS: -Xms64m -Xmx128m
    volumes:
    - zookeeper-2-data:/var/lib/zookeeper/data
    - zookeeper-2-log:/var/lib/zookeeper/log
    networks:
    - kafka-lab
    mem_limit: 320m
    stop_grace_period: 30s
  zookeeper-3:
    image: confluentinc/cp-zookeeper:7.9.10
    hostname: zookeeper-3
    restart: unless-stopped
    environment:
      ZOOKEEPER_SERVER_ID: '3'
      ZOOKEEPER_CLIENT_PORT: '2181'
      ZOOKEEPER_TICK_TIME: '2000'
      ZOOKEEPER_INIT_LIMIT: '10'
      ZOOKEEPER_SYNC_LIMIT: '5'
      ZOOKEEPER_SERVERS: zookeeper-1:2888:3888;zookeeper-2:2888:3888;zookeeper-3:2888:3888
      KAFKA_HEAP_OPTS: -Xms64m -Xmx128m
    volumes:
    - zookeeper-3-data:/var/lib/zookeeper/data
    - zookeeper-3-log:/var/lib/zookeeper/log
    networks:
    - kafka-lab
    mem_limit: 320m
    stop_grace_period: 30s
  kafka-1:
    image: confluentinc/cp-kafka:7.9.10
    hostname: kafka-1
    restart: unless-stopped
    depends_on:
    - zookeeper-1
    - zookeeper-2
    - zookeeper-3
    ports:
    - 127.0.0.1:19092:19092
    environment:
      KAFKA_BROKER_ID: '1'
      KAFKA_ZOOKEEPER_CONNECT: zookeeper-1:2181,zookeeper-2:2181,zookeeper-3:2181
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:19092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-1:9092,EXTERNAL://localhost:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: '3'
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: '3'
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: '2'
      KAFKA_DEFAULT_REPLICATION_FACTOR: '3'
      KAFKA_MIN_INSYNC_REPLICAS: '2'
      KAFKA_NUM_PARTITIONS: '3'
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: '0'
      KAFKA_HEAP_OPTS: -Xms128m -Xmx384m
    volumes:
    - kafka-1-data:/var/lib/kafka/data
    networks:
    - kafka-lab
    mem_limit: 750m
    stop_grace_period: 40s
  kafka-2:
    image: confluentinc/cp-kafka:7.9.10
    hostname: kafka-2
    restart: unless-stopped
    depends_on:
    - zookeeper-1
    - zookeeper-2
    - zookeeper-3
    ports:
    - 127.0.0.1:19093:19093
    environment:
      KAFKA_BROKER_ID: '2'
      KAFKA_ZOOKEEPER_CONNECT: zookeeper-1:2181,zookeeper-2:2181,zookeeper-3:2181
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:19093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-2:9092,EXTERNAL://localhost:19093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: '3'
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: '3'
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: '2'
      KAFKA_DEFAULT_REPLICATION_FACTOR: '3'
      KAFKA_MIN_INSYNC_REPLICAS: '2'
      KAFKA_NUM_PARTITIONS: '3'
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: '0'
      KAFKA_HEAP_OPTS: -Xms128m -Xmx384m
    volumes:
    - kafka-2-data:/var/lib/kafka/data
    networks:
    - kafka-lab
    mem_limit: 750m
    stop_grace_period: 40s
  kafka-3:
    image: confluentinc/cp-kafka:7.9.10
    hostname: kafka-3
    restart: unless-stopped
    depends_on:
    - zookeeper-1
    - zookeeper-2
    - zookeeper-3
    ports:
    - 127.0.0.1:19094:19094
    environment:
      KAFKA_BROKER_ID: '3'
      KAFKA_ZOOKEEPER_CONNECT: zookeeper-1:2181,zookeeper-2:2181,zookeeper-3:2181
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:19094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-3:9092,EXTERNAL://localhost:19094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: '3'
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: '3'
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: '2'
      KAFKA_DEFAULT_REPLICATION_FACTOR: '3'
      KAFKA_MIN_INSYNC_REPLICAS: '2'
      KAFKA_NUM_PARTITIONS: '3'
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: '0'
      KAFKA_HEAP_OPTS: -Xms128m -Xmx384m
    volumes:
    - kafka-3-data:/var/lib/kafka/data
    networks:
    - kafka-lab
    mem_limit: 750m
    stop_grace_period: 40s
  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    restart: unless-stopped
    ports:
    - 127.0.0.1:8088:8080
    depends_on:
    - kafka-1
    - kafka-2
    - kafka-3
    environment:
      KAFKA_CLUSTERS_0_NAME: DigitalFix-EV3
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka-1:9092,kafka-2:9092,kafka-3:9092
      JAVA_OPTS: -Xms64m -Xmx256m
    networks:
    - kafka-lab
    mem_limit: 500m
  kafka-init:
    image: confluentinc/cp-kafka:7.9.10
    profiles:
    - tools
    entrypoint:
    - /bin/bash
    - /scripts/init-topics.sh
    volumes:
    - ./infraestructura-kafka/init-topics.sh:/scripts/init-topics.sh:ro
    depends_on:
    - kafka-1
    - kafka-2
    - kafka-3
    networks:
    - kafka-lab
    environment:
      KAFKA_HEAP_OPTS: -Xms64m -Xmx256m
    mem_limit: 450m
  kafka-admin:
    profiles:
    - apps
    build:
      context: ./ms-digitalfix-kafka-admin
    restart: unless-stopped
    ports:
    - 127.0.0.1:8090:8090
    depends_on:
    - kafka-1
    - kafka-2
    - kafka-3
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka-1:9092,kafka-2:9092,kafka-3:9092
      JAVA_TOOL_OPTIONS: -Xms64m -Xmx192m
    networks:
    - kafka-lab
    mem_limit: 400m
  kafka-analytics:
    profiles:
    - apps
    build:
      context: ./ms-digitalfix-kafka-analytics
    restart: unless-stopped
    ports:
    - 127.0.0.1:8091:8091
    depends_on:
    - kafka-1
    - kafka-2
    - kafka-3
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka-1:9092,kafka-2:9092,kafka-3:9092
      JAVA_TOOL_OPTIONS: -Xms64m -Xmx192m
    networks:
    - kafka-lab
    mem_limit: 400m
networks:
  kafka-lab:
    driver: bridge
volumes:
  zookeeper-1-data: {}
  zookeeper-1-log: {}
  zookeeper-2-data: {}
  zookeeper-2-log: {}
  zookeeper-3-data: {}
  zookeeper-3-log: {}
  kafka-1-data: {}
  kafka-2-data: {}
  kafka-3-data: {}
