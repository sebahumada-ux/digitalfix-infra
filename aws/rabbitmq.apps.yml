services:
  rabbit-admin:
    build:
      context: ./ms-digitalfix-rabbit-admin
    container_name: digitalfix-rabbit-admin
    restart: unless-stopped
    environment:
      RABBITMQ_HOST: rabbitmq-1
      RABBITMQ_PORT: "5672"
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:?}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?}
      JAVA_TOOL_OPTIONS: "-Xms64m -Xmx192m"
    ports:
      - "127.0.0.1:8084:8084"
    depends_on:
      - rabbitmq-1
    networks:
      - digitalfix-network
    mem_limit: 400m

  notify:
    build:
      context: ./ms-digitalfix-notify
    container_name: digitalfix-notify
    restart: unless-stopped
    environment:
      RABBITMQ_HOST: rabbitmq-1
      RABBITMQ_PORT: "5672"
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:?}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?}
      JAVA_TOOL_OPTIONS: "-Xms64m -Xmx192m"
    expose:
      - "8083"
    depends_on:
      - rabbitmq-1
    networks:
      - digitalfix-network
    mem_limit: 400m
